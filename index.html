<script>
// Any uncaught error is shown on screen, so failures on a phone are never silent.
const showFatal = m => { const el = document.getElementById('msg') || document.getElementById('rMsg'); if (el) el.textContent = 'Error: ' + m; };
addEventListener('error', e => showFatal(e.message));
addEventListener('unhandledrejection', e => showFatal(e.reason?.message || e.reason));
</script>

<script type="module">
import { passes, exportTicks, frameAt } from './timing.js';

const $ = s => document.querySelector(s);
const cv = $('#cv'), g = cv.getContext('2d'), cam = $('#cam'), tl = $('#tl'), tlIn = $('#tlIn'), panel = $('#panel'), msg = $('#msg');
const BLENDS = [['source-over', 'Normal'], ['multiply', 'Multiplicar'], ['screen', 'Pantalla'], ['overlay', 'Superponer'],
  ['lighter', 'Añadir'], ['subtract', 'Restar'], ['difference', 'Diferencia'], ['exclusion', 'Exclusión'],
  ['darken', 'Oscurecer'], ['lighten', 'Aclarar'], ['color-dodge', 'Sobreexponer'], ['color-burn', 'Subexponer'],
  ['hard-light', 'Luz fuerte'], ['soft-light', 'Luz suave'], ['hue', 'Tono'], ['saturation', 'Saturación'],
  ['color', 'Color'], ['luminosity', 'Luminosidad']];
const DEF = {
  id: '', name: 'Sin título', w: 1280, h: 720, fps: 12, mode: 'normal', bg: '#ffffff', onion: true, onionOp: 0.4,
  camId: '', burstN: 10, burstS: 3, expFmt: 'mp4', gifW: '480', expBy: 'reps', expReps: 3, expSecs: 10, frames: [],
  layers: [{ id: 'frames', type: 'frames', name: 'Cuadros', blend: 'source-over', opacity: 1, visible: true }],
};
// Formats the browser can record natively, best codec first.
const FORMATS = {
  mp4: { name: 'MP4 (H.264)', video: ['video/mp4;codecs=avc1.42E01E', 'video/mp4'], audio: ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4'] },
  webm: { name: 'WebM (VP9)', video: ['video/webm;codecs=vp9', 'video/webm'], audio: ['video/webm;codecs=vp9,opus', 'video/webm'] },
  gif: { name: 'GIF animado' },
  png: { name: 'Secuencia PNG (ZIP)' },
  jpg: { name: 'Secuencia JPG (ZIP)' },
};
const fmtOk = k => !FORMATS[k].video || FORMATS[k].video.some(t => MediaRecorder.isTypeSupported(t));
// Loaded only when exporting a GIF or an image sequence.
const GIFENC = 'https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.esm.js';
const FFLATE = 'https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js';
// Phone as remote camera: PeerJS's public broker only introduces the devices; photos travel peer to peer.
const PEERJS = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/+esm';
const QRGEN = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/+esm';
const PUBLIC_URL = 'https://medaunbrauni.github.io/StopMotion_Medaunbrauni/';
// A phone can't use localhost, so the QR always points at the published copy when running locally.
const baseUrl = () => ['localhost', '127.0.0.1'].includes(location.hostname) ? PUBLIC_URL : location.origin + location.pathname;
const LEAD = 0.15; // seconds between pressing play and the first frame

let P = structuredClone(DEF);
let tab = null, curTick = 0, ppt = 24, selFrame = null, selLayerId = 'frames', replaceIdx = null;
const count = { big: '', sub: '' }; // burst countdown overlay
let replaceBack = false; // after a replace, return to the Cuadro tab (true) or stay on the camera
let peer = null, remoteUrl = '', qrSvg = '', remoteErr = '';
const conns = new Set(); // connected phones
let facing = 'environment', camErr = '', player = null, recA = null, lastExport = null, quiet = false;
let burst = null; // {running, pending: [{blob, url, keep}], cancel}
const blobs = new Map(), imgs = new Map(), auds = new Map();

const uid = () => Math.random().toString(36).slice(2);
const esc = s => String(s).replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const fmt = s => `${s < 0 ? '-' : ''}${Math.floor(Math.abs(s) / 60)}:${(Math.abs(s) % 60).toFixed(2).padStart(5, '0')}`;
const T = () => P.frames.reduce((s, f) => s + f.hold, 0);
const frameStart = i => P.frames.slice(0, i).reduce((s, f) => s + f.hold, 0);
const curFrame = () => P.frames.length ? frameAt(P.frames.map(f => f.hold), Math.floor(curTick)) : -1;
const selLayer = () => P.layers.find(l => l.id === selLayerId) ?? P.layers.find(l => l.type === 'frames');
let _ac;
const ac = () => _ac ||= new AudioContext();

// ---------- storage: blobs (images/audio) + project JSON in IndexedDB ----------
const req = r => new Promise((ok, ko) => { r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
const dbp = new Promise((ok, ko) => {
  const r = indexedDB.open('stopmo2', 1);
  r.onupgradeneeded = () => { r.result.createObjectStore('blobs', { autoIncrement: true }); r.result.createObjectStore('meta'); };
  r.onsuccess = () => ok(r.result);
  r.onerror = () => ko(r.error);
});
const store = async (name, mode = 'readonly') => (await dbp).transaction(name, mode).objectStore(name);
// Each project is a meta record keyed by its id; meta 'current' remembers the open one.
let saveT;
async function saveNow() {
  clearTimeout(saveT);
  P.updated = Date.now();
  const s = await store('meta', 'readwrite');
  s.put(P, P.id);
  s.put(P.id, 'current');
  document.title = `${P.name} · StopMo`;
  $('#fileBtn').textContent = `☰ ${P.name}`;
}
function save() { clearTimeout(saveT); saveT = setTimeout(saveNow, 300); }
const allProjects = async () => (await req((await store('meta')).getAll())).filter(p => p?.frames);
async function putBlob(blob) {
  const key = await req((await store('blobs', 'readwrite')).add(blob));
  blobs.set(key, { blob, url: URL.createObjectURL(blob) });
  return key;
}
// Drop blobs no frame or layer references (duplicated frames share a blob).
async function gc() {
  const used = new Set();
  for (const p of [P, ...(await allProjects()).filter(x => x.id !== P.id)]) {
    p.frames.forEach(f => used.add(f.key));
    p.layers.forEach(l => l.key != null && used.add(l.key));
  }
  const dead = [...blobs.keys()].filter(k => !used.has(k));
  if (!dead.length) return;
  const s = await store('blobs', 'readwrite');
  for (const k of dead) {
    s.delete(k);
    URL.revokeObjectURL(blobs.get(k).url);
    blobs.delete(k); imgs.delete(k); auds.delete(k);
  }
}
async function load() {
  const s = await store('blobs'), k = s.getAllKeys(), v = s.getAll();
  const [keys, vals] = await Promise.all([req(k), req(v)]);
  keys.forEach((key, i) => blobs.set(key, { blob: vals[i], url: URL.createObjectURL(vals[i]) }));
  const m = await store('meta'), cur = m.get('current'), old = m.get('project');
  const [curId, legacy] = await Promise.all([req(cur), req(old)]);
  let p = curId && await req((await store('meta')).get(curId));
  if (!p && legacy) { // single-project format from earlier versions
    p = { ...legacy, id: uid(), name: 'Proyecto 1' };
    (await store('meta', 'readwrite')).delete('project');
  }
  await openProject(p ?? { id: uid(), name: 'Proyecto 1' });
}
async function openProject(p) {
  if (player) togglePlay();
  if (burst) endBurst();
  P = { ...structuredClone(DEF), ...p };
  await Promise.all(P.layers.filter(l => l.type === 'audio').map(l => decodeAudio(l.key).catch(() => {})));
  for (const l of P.layers) if (l.type === 'audio') { l.trimIn ??= 0; l.dur ??= auds.get(l.key)?.buf.duration ?? 0; }
  selFrame = replaceIdx = null; curTick = 0; selLayerId = 'frames'; lastExport = null;
  cv.width = P.w; cv.height = P.h;
  $('#mode').value = P.mode;
  $('#fps').value = P.fps;
  await saveNow();
  renderTL();
  if (tab) renderPanel();
  requestDraw();
}
const downloadFile = f => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(f); a.download = f.name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
};
// Project file: a zip with project.json plus every image/audio blob it uses.
// ponytail: builds the whole zip in memory; stream it if projects outgrow the phone's RAM.
async function saveProjectFile() {
  await saveNow();
  const { zipSync } = await import(FFLATE);
  const keys = [...new Set([...P.frames.map(f => f.key), ...P.layers.filter(l => l.key != null).map(l => l.key)])];
  const files = { 'project.json': new TextEncoder().encode(JSON.stringify({
    app: 'stopmo', version: 1, project: P, blobs: Object.fromEntries(keys.map(k => [k, blobs.get(k).blob.type])) })) };
  for (const k of keys) files[`blobs/${k}`] = new Uint8Array(await blobs.get(k).blob.arrayBuffer());
  downloadFile(new File([zipSync(files, { level: 0 })], `${P.name.replace(/[\\/:*?"<>|]+/g, '_')}.zip`, { type: 'application/zip' }));
}
async function openProjectFile(file) {
  try {
    const { unzipSync } = await import(FFLATE);
    const z = unzipSync(new Uint8Array(await file.arrayBuffer()));
    const meta = z['project.json'] && JSON.parse(new TextDecoder().decode(z['project.json']));
    if (meta?.app !== 'stopmo') throw new Error('no es un proyecto de StopMo');
    const map = new Map();
    for (const [k, type] of Object.entries(meta.blobs)) map.set(k, await putBlob(new Blob([z[`blobs/${k}`]], { type })));
    const p = meta.project;
    p.frames.forEach(f => f.key = map.get(String(f.key)));
    p.layers.forEach(l => { if (l.key != null) l.key = map.get(String(l.key)); });
    await saveNow();
    await openProject({ ...p, id: uid() });
    refreshProjects();
  } catch (e) {
    alert('No se pudo abrir el archivo: ' + e.message);
  }
}
let projList = [];
async function refreshProjects() {
  projList = (await allProjects()).sort((a, b) => (b.updated || 0) - (a.updated || 0));
  if (menu.matches(':popover-open')) renderMenu();
}
const menu = $('#fileMenu');
function renderMenu() { menu.innerHTML = filePanel(); bindValues(menu); }
menu.addEventListener('beforetoggle', e => { if (e.newState === 'open') { renderMenu(); refreshProjects(); } });

function img(key) {
  let im = imgs.get(key);
  if (!im) {
    im = new Image();
    im.onload = requestDraw;
    im.src = blobs.get(key)?.url ?? '';
    imgs.set(key, im);
  }
  return im;
}
// Resolves once the image has loaded (img.decode() can stall while the tab is hidden).
const loaded = im => im.complete && im.naturalWidth ? Promise.resolve(im)
  : new Promise((ok, ko) => { im.addEventListener('load', () => ok(im), { once: true }); im.addEventListener('error', ko, { once: true }); });
// Keeps a reversed copy so boomerang's backward passes play the audio backwards.
async function decodeAudio(key) {
  if (auds.has(key)) return;
  const buf = await ac().decodeAudioData(await blobs.get(key).blob.arrayBuffer());
  const rev = new AudioBuffer({ length: buf.length, numberOfChannels: buf.numberOfChannels, sampleRate: buf.sampleRate });
  for (let c = 0; c < buf.numberOfChannels; c++) rev.getChannelData(c).set(buf.getChannelData(c).slice().reverse());
  auds.set(key, { buf, rev });
}

// ---------- compositing ----------
const scratch = document.createElement('canvas');
function fit(c, src, W, H) {
  const w = src.videoWidth || src.naturalWidth, h = src.videoHeight || src.naturalHeight;
  if (!w) return;
  const s = Math.min(W / w, H / h);
  c.drawImage(src, (W - w * s) / 2, (H - h * s) / 2, w * s, h * s);
}
function geo(l, im) {
  const iw = im.naturalWidth, ih = im.naturalHeight, [cl, ct, cr, cb] = l.crop;
  return { sx: iw * cl, sy: ih * ct, sw: iw * (1 - cl - cr), sh: ih * (1 - ct - cb) };
}
function xf(c, l) { c.translate(l.x, l.y); c.rotate(l.rot * Math.PI / 180); c.scale(l.scale, l.scale); }
// ponytail: "Restar" blends on the CPU with getImageData; fine for a prototype, WebGL if it gets slow at full HD.
function blendDraw(g, blend, paint) {
  g.save();
  if (blend !== 'subtract') { g.globalCompositeOperation = blend; paint(g); g.restore(); return; }
  const W = g.canvas.width, H = g.canvas.height;
  scratch.width = W; scratch.height = H;
  const b = scratch.getContext('2d', { willReadFrequently: true });
  paint(b);
  const A = g.getImageData(0, 0, W, H), a = A.data, d = b.getImageData(0, 0, W, H).data;
  for (let i = 0; i < a.length; i += 4) {
    const k = d[i + 3] / 255;
    if (k) { a[i] -= d[i] * k; a[i + 1] -= d[i + 1] * k; a[i + 2] -= d[i + 2] * k; }
  }
  g.putImageData(A, 0, 0);
  g.restore();
}
function drawScene(g, tick, o = {}) {
  const W = g.canvas.width, H = g.canvas.height;
  tick = Math.floor(tick);
  const fi = P.frames.length ? frameAt(P.frames.map(f => f.hold), tick) : -1;
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  g.fillStyle = P.bg; g.fillRect(0, 0, W, H);
  for (const l of P.layers) {
    if (!l.visible || l.type === 'audio') continue;
    if (l.type === 'image' && (tick < l.start || (l.end != null && tick >= l.end))) continue;
    blendDraw(g, l.blend, c => {
      c.globalAlpha = l.opacity;
      if (l.type === 'frames') {

function scheduleAudio(actx, out, p, when, fps, srcs) {
  const lo = (p.dir > 0 ? p.a : p.a - p.n + 1) / fps, hi = lo + p.n / fps;

    if (p.dir > 0) { src.buffer = A.buf; src.start(when + s0 - lo, l.trimIn + s0 - l.offset, s1 - s0); }
    else { src.buffer = A.rev; src.start(when + hi - s1, A.buf.duration - (l.trimIn + s1 - l.offset), s1 - s0); }
    srcs.add(src);
    src.onended = () => srcs.delete(src);

}

    last = o;

    // Ticks with the same frame and the same visible image layers render identically.
    const sig = tk => frameAt(holds, tk) + ':' + P.layers
      .filter(l => l.type === 'image' && l.visible && tk >= l.start && (l.end == null || tk < l.end)).map(l => l.id);
    const render = tk => { drawScene(fg, tk); og.drawImage(full, 0, 0, w, h); };
    let bytes, ext, type;
    if (gif) {
      const { GIFEncoder, quantize, applyPalette } = await import(GIFENC);
      const enc = GIFEncoder(), cs = n => Math.round(n * 100 / P.fps); // GIF delays are centiseconds
      for (let i = 0; i < ticks.length;) {
        let j = i + 1;
        while (j < ticks.length && sig(ticks[j]) === sig(ticks[i])) j++;
        render(ticks[i]);
        const { data } = og.getImageData(0, 0, w, h), pal = quantize(data, 256);
        enc.writeFrame(applyPalette(data, pal), w, h, { palette: pal, delay: (cs(j) - cs(i)) * 10, repeat: P.mode === 'normal' ? -1 : 0 });
        say(`Exportando… ${Math.round(j / ticks.length * 100)}%`);
        await new Promise(r => setTimeout(r));
        i = j;
      }
      enc.finish();
      bytes = enc.bytes(); ext = 'gif'; type = 'image/gif';
    } else {
      const { zipSync } = await import(FFLATE);
      const files = {}, cache = new Map(), mime = P.expFmt === 'png' ? 'image/png' : 'image/jpeg';
      for (let i = 0; i < ticks.length; i++) {
        const s = sig(ticks[i]);
        if (!cache.has(s)) {
          render(ticks[i]);
          const blob = await new Promise(r => out.toBlob(r, mime, 0.92));
          cache.set(s, new Uint8Array(await blob.arrayBuffer()));
        }
        files[`cuadro_${String(i + 1).padStart(4, '0')}.${P.expFmt}`] = cache.get(s);
        say(`Exportando… ${Math.round((i + 1) / ticks.length * 100)}%`);
      }
      bytes = zipSync(files, { level: 0 }); // images are already compressed
      ext = 'zip'; type = 'application/zip';
    }
    lastExport = new File([bytes], `stopmo-${Date.now()}.${ext}`, { type });
    renderPanel();
    say('Listo.');
  } catch (e) {
    say('Error al exportar: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

// ---------- timeline ----------
function wave(buf, w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w)); c.height = h;
  const x = c.getContext('2d'), d = buf.getChannelData(0), step = d.length / c.width;
  x.fillStyle = '#5ac8fa';
  for (let i = 0; i < c.width; i++) {
    let m = 0;
    for (let j = Math.floor(i * step), e = Math.floor((i + 1) * step); j < e; j += 16) m = Math.max(m, Math.abs(d[j]));
    const y = Math.max(1, m * h / 2);
    x.fillRect(i, h / 2 - y, 1, y * 2);
  }
  return c;
}
function renderTL() {
  const t = T(), half = tl.clientWidth / 2;
  tlIn.style.padding = `0 ${half}px`;
  tlIn.style.minWidth = `${Math.max(t, 1) * ppt + 2 * half}px`;
  const rows = [`<div class="row">${P.frames.map((f, i) =>
    `<div class="th${i === selFrame ? ' sel' : ''}" data-fi="${i}" style="width:${f.hold * ppt}px"${f.hold > 1 ? ` data-h="×${f.hold}"` : ''}><img src="${blobs.get(f.key)?.url ?? ''}" alt=""></div>`).join('')}</div>`];
  for (const l of [...P.layers].reverse()) {
    const sel = l.id === selLayerId ? ' sel' : '';
    if (l.type === 'image') rows.push(`<div class="row"><div class="lbar${sel}" data-li="${l.id}" style="margin-left:${l.start * ppt}px;width:${Math.max(1, (l.end ?? t) - l.start) * ppt}px">${esc(l.name)}</div></div>`);
    if (l.type === 'audio') rows.push(`<div class="row arow"><div class="wave${sel}" data-li="${l.id}"><span class="wname">${esc(l.name)}</span>
      <i class="edge" data-edge="l"></i><i class="edge" data-edge="r"></i></div></div>`);
  }
  tlIn.innerHTML = rows.join('');
  tlIn.querySelectorAll('.wave').forEach(el => {
    const l = P.layers.find(x => x.id === el.dataset.li), A = auds.get(l.key);
    if (!A) return;
    const w = A.buf.duration * P.fps * ppt;
    const c = wave(A.buf, Math.min(w, 8000), 32);
    c.style.width = w + 'px';
    el.prepend(c);
    placeClip(el, l);
  });

  tl.scrollLeft = curTick * ppt;
}
// The clip box shows the visible part; the full waveform slides inside it.
function placeClip(el, l) {
  const k = P.fps * ppt;
  el.style.marginLeft = l.offset * k + 'px';
  el.style.width = Math.max(l.dur * k, 1) + 'px';
  el.querySelector('canvas').style.marginLeft = -l.trimIn * k + 'px';
}
// Drag a clip to move it, or drag its edges to trim; everything snaps to frames.
let clipDrag = null;
tlIn.addEventListener('pointerdown', e => {

  const l = el && P.layers.find(x => x.id === el.dataset.li), A = l && auds.get(l.key);
  if (!A) return;
  el.setPointerCapture(e.pointerId);
  clipDrag = { el, l, A, x0: e.clientX, edge: e.target.dataset.edge, o: l.offset, i: l.trimIn, d: l.dur, moved: false };

tlIn.addEventListener('pointermove', e => {
  const g = clipDrag;

  if (dt) g.moved = true;
  if (g.edge === 'l') {
    dt = Math.max(-g.i, Math.min(dt, g.d - min));
    Object.assign(g.l, { offset: g.o + dt, trimIn: g.i + dt, dur: g.d - dt });
  } else if (g.edge === 'r') {
    g.l.dur = Math.max(min, Math.min(g.d + dt, g.A.buf.duration - g.i));

const pts = new Map();
cv.onpointerdown = e => {

cv.onpointermove = e => {
  if (!pts.has(e.pointerId)) return;
  const l = selLayer(), r = cv.getBoundingClientRect(), k = Math.max(P.w / r.width, P.h / r.height);
  const before = [...pts.values()].slice(0, 2);
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const after = [...pts.values()].slice(0, 2);
  if (after.length === 2) {
    const dist = p => Math.hypot(p[1].x - p[0].x, p[1].y - p[0].y), ang = p => Math.atan2(p[1].y - p[0].y, p[1].x - p[0].x);
    l.scale *= dist(after) / dist(before) || 1;
    l.rot += (ang(after) - ang(before)) * 180 / Math.PI;
  }
  l.x += (after.reduce((s, p) => s + p.x, 0) - before.reduce((s, p) => s + p.x, 0)) / after.length * k;
  l.y += (after.reduce((s, p) => s + p.y, 0) - before.reduce((s, p) => s + p.y, 0)) / after.length * k;
  requestDraw();
};

const acts = {
  flip() { facing = facing === 'environment' ? 'user' : 'environment'; P.camId = ''; save(); renderPanel(); startCam(); },
  shot,
  burst: runBurst,
  burstStop() { if (burst) burst.cancel = true; },
  burstPlay: toggleBurstPreview,
  async burstAdd() {
    const keep = burst.pending.filter(p => p.keep);
    endBurst();
    for (const p of keep) await addFrame(p.blob);
  },
  burstDiscard() { if (confirm('¿Descartar todos los disparos?')) endBurst(); },
  cancelReplace() { replaceIdx = null; renderPanel(); requestDraw(); },
  hold(el) { const f = P.frames[selFrame]; f.hold = Math.max(1, f.hold + +el.dataset.d); changed(); },
  move(el) {
    const j = selFrame + +el.dataset.d;
    if (j < 0 || j >= P.frames.length) return;
    [P.frames[selFrame], P.frames[j]] = [P.frames[j], P.frames[selFrame]];
    selFrame = j; curTick = frameStart(j);
    changed();
  },
  replaceCam() { replaceIdx = selFrame; replaceBack = true; setTab('cam'); },
  replaceToggle() {
    replaceIdx = replaceIdx != null ? null : selFrame;
    replaceBack = false;
    if (replaceIdx != null) P.onion = true;
    renderPanel(); requestDraw(); sendOnion();
  },
  camOn: startCam,
  remoteOn: startRemoteHost,
  remoteOff: stopRemoteHost,
  dup() { P.frames.splice(selFrame + 1, 0, { ...P.frames[selFrame] }); selFrame++; curTick = frameStart(selFrame); changed(); },
  delFrame() {
    P.frames.splice(selFrame, 1);
    selFrame = P.frames.length ? Math.min(selFrame, P.frames.length - 1) : null;
    if (selFrame != null) curTick = frameStart(selFrame);
    gc(); changed();
  },
  vis(el) { const l = P.layers.find(x => x.id === el.dataset.id); l.visible = !l.visible; changed(); },
  rec: toggleRec,
  startHere() { const l = selLayer(); l.start = Math.floor(curTick); if (l.end != null && l.end <= l.start) l.end = null; changed(); },
  endHere() { const l = selLayer(), e = Math.floor(curTick) + 1; if (e > l.start) l.end = e; changed(); },
  endNull() { selLayer().end = null; changed(); },
  center() { Object.assign(selLayer(), { x: P.w / 2, y: P.h / 2, rot: 0 }); changed(); },
  order(el) {
    const i = P.layers.indexOf(selLayer()), j = i + +el.dataset.d;
    if (j < 0 || j >= P.layers.length) return;
    [P.layers[i], P.layers[j]] = [P.layers[j], P.layers[i]];
    changed();
  },
  delLayer() { const l = selLayer(); P.layers = P.layers.filter(x => x !== l); selLayerId = 'frames'; gc(); changed(); },
  off(el) { selLayer().offset += +el.dataset.d / P.fps; changed(); },
  offHere() { selLayer().offset = Math.floor(curTick) / P.fps; changed(); },
  // Splits the selected clip at the cursor; both halves share the same recording.
  cut() {
    const l = selLayer(), t = Math.floor(curTick) / P.fps, at = t - l.offset;
    if (at <= 0 || at >= l.dur) return alert('Pon el cursor sobre el clip para cortarlo.');
    const right = { ...l, id: uid(), name: l.name.replace(/( \(\d+\))?$/, '') + ' (2)', offset: t, trimIn: l.trimIn + at, dur: l.dur - at };
    l.dur = at;
    P.layers.splice(P.layers.indexOf(l) + 1, 0, right);
    selLayerId = right.id;
    changed();
  },
  export: () => FORMATS[P.expFmt]?.video ? exportVideo() : exportFrames(),
  share() { navigator.share({ files: [lastExport] }).catch(() => {}); },
  download() { downloadFile(lastExport); },
  async newProj() {
    menu.hidePopover();
    await saveNow();
    await openProject({ id: uid(), name: `Proyecto ${projList.length + 1}` });
    refreshProjects();
  },
  async dupProj() {
    menu.hidePopover();
    await saveNow();
    await openProject({ ...structuredClone(P), id: uid(), name: P.name + ' (copia)' });
    refreshProjects();
  },
  async openProj(el) {
    menu.hidePopover();
    await saveNow();
    await openProject(await req((await store('meta')).get(el.dataset.id)));
    refreshProjects();
  },
  async delProj(el) {
    const p = projList.find(x => x.id === el.dataset.id);
    if (!confirm(`¿Eliminar "${p.name}"? No se puede deshacer.`)) return;
    await req((await store('meta', 'readwrite')).delete(p.id));
    if (p.id === P.id) {
      const next = (await allProjects()).sort((a, b) => (b.updated || 0) - (a.updated || 0))[0];
      await openProject(next ?? { id: uid(), name: 'Proyecto 1' });
    }
    await gc();
    refreshProjects();
  },
  saveFile: saveProjectFile,
};
panel.onclick = e => {
  const a = e.target.closest('[data-act]');
  if (a) return acts[a.dataset.act]?.(a);
  const pi = e.target.closest('[data-pi]');
  if (pi) { stopBurstPreview(); const p = burst.pending[+pi.dataset.pi]; p.keep = !p.keep; return renderPanel(); }
  const s = e.target.closest('[data-sel]');
  if (s) { selLayerId = s.dataset.sel; renderTL(); renderPanel(); requestDraw(); }
};
panel.oninput = e => {
  const el = e.target, k = el.dataset.p, lk = el.dataset.lp;
  if (!k && !lk) return;
  const v = el.type === 'checkbox' ? el.checked : ['range', 'number'].includes(el.type) ? +el.value : el.value;
  if (k) { if (el.type === 'radio' && !el.checked) return; P[k] = v; if (k === 'camId') startCam(); }
  else { const l = selLayer(), [a, b] = lk.split('.'); if (b == null) l[a] = v; else l[a][b] = v; }
  save(); requestDraw();
};
panel.onchange = async e => {
  const el = e.target;
  if (!el.dataset.file) { if (tab === 'export') renderPanel(); return; }
  const files = [...el.files], kind = el.dataset.file;
  el.value = '';
  if (!files.length) return;
  if (kind === 'frames') for (const f of files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }))) await addFrame(f);
  if (kind === 'replace') { replaceIdx = selFrame; replaceBack = true; await addFrame(files[0]); }
  if (kind === 'layerImg') await addImageLayer(files[0]);
  if (kind === 'layerAud') await addAudio(files[0], files[0].name, Math.floor(curTick) / P.fps);
  if (kind === 'project') { menu.hidePopover(); await openProjectFile(files[0]); }
};

// The Archivo menu shares the panel's handlers.
menu.onclick = panel.onclick;
menu.oninput = panel.oninput;
menu.onchange = panel.onchange;

$('#playBtn').onclick = togglePlay;

// Phone quick controls (visible only on narrow screens).
$('#qPlay').onclick = togglePlay;
$('#qShot').onclick = () => tab === 'cam' ? shot() : setTab('cam');
$('#qOnion').onclick = () => { P.onion = !P.onion; save(); if (tab === 'cam') renderPanel(); requestDraw(); };
$('#qFull').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(() => {});
$('#qDock').onclick = () => { document.body.classList.add('dock'); renderTL(); };
$('#dockClose').onclick = () => { document.body.classList.remove('dock'); if (tab !== 'cam') setTab('cam'); };
// Tapping the picture during playback stops it and returns to the camera.
cv.addEventListener('click', () => { if (player) togglePlay(); });
$('#mode').onchange = e => { P.mode = e.target.value; save(); if (tab === 'export') renderPanel(); };
$('#fps').onchange = e => {
  P.fps = Math.min(30, Math.max(1, +e.target.value || 12));
  e.target.value = P.fps;
  save(); renderTL(); renderPanel(); requestDraw();
};
$('#zoomIn').onclick = () => { ppt = Math.min(120, ppt * 1.5); renderTL(); };
$('#zoomOut').onclick = () => { ppt = Math.max(4, ppt / 1.5); renderTL(); };
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
addEventListener('resize', renderTL);

// Keyboard: ←/→ one frame, ↑/↓ one second, Space plays/pauses.
addEventListener('keydown', e => {
  if (e.target.closest('input, select, textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === ' ') {
    if (e.target.closest('button')) return; // Space already presses a focused button
    e.preventDefault();
    togglePlay();
    return;
  }
  const dir = { ArrowRight: 1, ArrowLeft: -1, ArrowUp: 1, ArrowDown: -1 }[e.key];
  if (!dir || !P.frames.length) return;
  e.preventDefault();
  if (player) togglePlay();
  ac().resume();
  curTick = e.key === 'ArrowRight' || e.key === 'ArrowLeft'
    ? frameStart(Math.max(0, Math.min(P.frames.length - 1, curFrame() + dir)))
    : Math.max(0, Math.min(T() - 1, Math.floor(curTick) + dir * P.fps));
  if (selFrame != null) {
    selFrame = curFrame();
    if (replaceIdx != null) { replaceIdx = selFrame; sendOnion(); }
  }
  renderTL();
  if (tab !== 'layers') renderPanel();
  requestDraw();
  scrub(curTick);
});

// Keep the screen on while animating.
const wake = () => navigator.wakeLock?.request('screen').catch(() => {});
document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && wake());
wake();

const remoteHost = new URLSearchParams(location.search).get('remote');
if (remoteHost) runRemote(remoteHost);
else {
  try { await load(); }
  catch (e) { alert('No se pudo abrir el almacenamiento del navegador (' + e.message + '). Los cambios no se guardarán; ¿estás en modo incógnito?'); }
  setTab('cam');
}
</script>
